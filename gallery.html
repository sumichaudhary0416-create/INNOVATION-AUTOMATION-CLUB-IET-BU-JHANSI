<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IAC Gallery</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body data-page="gallery">

<canvas id="techCircuitCanvas"></canvas>

<div id="scrollProgress"></div>

<div id="site-header"></div>


<main>


<section class="page-hero">

    <div class="page-hero-content reveal">

        <p class="section-label">
            MOMENTS OF IAC
        </p>

        <h1>
            Gallery
        </h1>

        <p>
            Activities, projects, events and collaboration.
        </p>

    </div>

</section>


<section class="section">

    <div class="gallery-grid">

        <article class="gallery-item reveal">

            <img
                src="assets/banners/iac-thinknext-banner.png"
                alt="IAC and ThinkNEXT Collaboration"
            >

            <div class="gallery-caption">
                IAC × ThinkNEXT Collaboration
            </div>

        </article>

    </div>


    <div class="empty-state reveal">

        <h3>
            More Photos Coming Soon
        </h3>

        <p>
            Workshop, competition and project photos
            will be added here.
        </p>

    </div>

</section>


</main>


<div id="site-footer"></div>

<script src="script.js"></script>

</body>
</html>
