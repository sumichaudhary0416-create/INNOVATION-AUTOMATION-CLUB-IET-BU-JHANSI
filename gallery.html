<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        IAC Gallery
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body data-page="gallery">


<div id="site-header"></div>


<main>


<section class="page-hero">

    <div class="page-hero-content reveal">

        <p class="section-label">
            MEMORIES
        </p>

        <h1>
            IAC Gallery
        </h1>

        <p>

            Workshops, projects,
            events and activities.

        </p>

    </div>

</section>


<section class="section">


    <div class="gallery-grid">


        <div class="gallery-card reveal">

            <img
                src="assets/gallery/gallery1.jpg"
                alt="IAC Gallery Photo"
            >

        </div>


        <div class="gallery-card reveal">

            <img
                src="assets/gallery/gallery2.jpg"
                alt="IAC Gallery Photo"
            >

        </div>


        <div class="gallery-card reveal">

            <img
                src="assets/gallery/gallery3.jpg"
                alt="IAC Gallery Photo"
            >

        </div>


        <div class="gallery-card reveal">

            <img
                src="assets/gallery/gallery4.jpg"
                alt="IAC Gallery Photo"
            >

        </div>


        <div class="gallery-card reveal">

            <img
                src="assets/gallery/gallery5.jpg"
                alt="IAC Gallery Photo"
            >

        </div>


        <div class="gallery-card reveal">

            <img
                src="assets/gallery/gallery6.jpg"
                alt="IAC Gallery Photo"
            >

        </div>


    </div>


</section>


<div
    class="modal"
    id="galleryModal"
>

    <div class="modal-content">

        <button
            class="modal-close"
            id="galleryClose"
        >
            ✕
        </button>

        <img
            id="galleryModalImage"
            alt="Gallery Preview"
        >

    </div>

</div>


</main>


<div id="site-footer"></div>


<script src="script.js"></script>


</body>

</html>
