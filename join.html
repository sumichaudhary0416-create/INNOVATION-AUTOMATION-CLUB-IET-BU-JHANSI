<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join IAC</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body data-page="join">

<canvas id="techCircuitCanvas"></canvas>

<div id="scrollProgress"></div>

<div id="site-header"></div>


<main>


<section class="page-hero">

    <div class="page-hero-content reveal">

        <p class="section-label">
            BE A PART OF IAC
        </p>

        <h1>
            Join Innovation & Automation Club
        </h1>

        <p>
            Learn • Build • Innovate
        </p>

    </div>

</section>


<section class="section">

    <div class="section-center reveal">

        <p class="section-label">
            MEMBERSHIP
        </p>

        <h2 class="section-title">
            Join IAC
        </h2>

        <p class="section-intro">

            Submit your details. Your registration will
            be saved and a confirmation email will be
            sent to you.

        </p>

    </div>


    <div class="join-form-card reveal">


        <form
            id="membershipForm"
            method="POST"
            target="joinSubmitFrame"
        >


            <input
                type="hidden"
                name="action"
                value="join"
            >


            <!-- Spam honeypot -->

            <input
                type="text"
                name="website"
                tabindex="-1"
                autocomplete="off"
                class="honeypot"
            >


            <div class="form-grid">


                <div class="form-group">

                    <label for="fullName">
                        Full Name *
                    </label>

                    <input
                        id="fullName"
                        name="fullName"
                        type="text"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email *
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        maxlength="150"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Contact Number
                    </label>

                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        maxlength="20"
                        autocomplete="tel"
                    >

                </div>


                <div class="form-group">

                    <label for="department">
                        Engineering Branch *
                    </label>

                    <select
                        id="department"
                        name="department"
                        required
                    >

                        <option value="">
                            Select Engineering Branch
                        </option>

                        <option value="Electronics & Instrumentation Engineering">
                            Electronics & Instrumentation Engineering
                        </option>

                        <option value="Computer Science Engineering">
                            Computer Science Engineering
                        </option>

                        <option value="Electronics & Communication Engineering">
                            Electronics & Communication Engineering
                        </option>

                        <option value="Food Technology">
                            Food Technology
                        </option>

                        <option value="Biotechnology">
                            Biotechnology
                        </option>

                        <option value="Mechanical Engineering">
                            Mechanical Engineering
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="year">
                        Year *
                    </label>

                    <select
                        id="year"
                        name="year"
                        required
                    >

                        <option value="">
                            Select Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="interest">
                        Area of Interest
                    </label>

                    <select
                        id="interest"
                        name="interest"
                    >

                        <option value="">
                            Select Interest
                        </option>

                        <option value="Embedded Systems">
                            Embedded Systems
                        </option>

                        <option value="Internet of Things">
                            Internet of Things
                        </option>

                        <option value="Automation">
                            Automation
                        </option>

                        <option value="Robotics">
                            Robotics
                        </option>

                        <option value="Circuit Making">
                            Circuit Making
                        </option>

                        <option value="PCB Designing">
                            PCB Designing
                        </option>

                        <option value="Programming">
                            Programming
                        </option>

                        <option value="Media">
                            Media
                        </option>

                        <option value="Documentation">
                            Documentation
                        </option>

                        <option value="Event Management">
                            Event Management
                        </option>

                    </select>

                </div>


            </div>


            <div class="form-group">

                <label for="message">
                    Why do you want to join IAC?
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    maxlength="1000"
                    placeholder="Tell us briefly..."
                ></textarea>

            </div>


            <p class="form-privacy">

                Your information will be used for
                IAC membership and club communication.

            </p>


            <button
                id="membershipSubmitButton"
                type="submit"
                class="btn join-submit-btn"
            >
                Submit Registration →
            </button>


            <div
                id="formMessage"
                class="form-message"
                aria-live="polite"
            ></div>


        </form>


        <iframe
            id="joinSubmitFrame"
            name="joinSubmitFrame"
            title="IAC registration submission"
            class="hidden-frame"
        ></iframe>


    </div>

</section>


</main>


<div id="site-footer"></div>

<script src="script.js"></script>

</body>
</html>
