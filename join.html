<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Join IAC
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body data-page="join">


<div id="site-header"></div>


<main>


<section class="page-hero">

    <div class="page-hero-content reveal">

        <p class="section-label">
            BECOME A MEMBER
        </p>

        <h1>
            Join IAC
        </h1>

        <p>
            Learn • Build • Collaborate • Innovate
        </p>

    </div>

</section>


<section class="section">


    <div class="form-box reveal">


        <form id="membershipForm">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Full Name *
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Enrollment Number *
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email *
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        WhatsApp Number *
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Department
                    </label>

                    <select class="form-control">

                        <option>
                            Electronics & Instrumentation
                        </option>

                        <option>
                            Electronics & Communication
                        </option>

                        <option>
                            Computer Science
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Year
                    </label>

                    <select class="form-control">

                        <option>
                            1st Year
                        </option>

                        <option>
                            2nd Year
                        </option>

                        <option>
                            3rd Year
                        </option>

                        <option>
                            4th Year
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>
                        Technical Interest
                    </label>

                    <textarea
                        class="form-control"
                        placeholder="IoT, Embedded Systems, Automation, PCB, Circuit Making..."
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label>
                        Why do you want to join IAC?
                    </label>

                    <textarea
                        class="form-control"
                    ></textarea>

                </div>


                <div class="form-group full">

                    <button
                        type="submit"
                        class="btn"
                    >
                        Submit
                    </button>

                    <p
                        id="formMessage"
                        class="form-message"
                    ></p>

                </div>


            </div>


        </form>


    </div>


</section>


</main>


<div id="site-footer"></div>


<script src="script.js"></script>


</body>

</html>
