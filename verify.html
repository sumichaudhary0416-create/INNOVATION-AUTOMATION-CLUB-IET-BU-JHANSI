<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify IAC Certificate</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body data-page="verify">

<canvas id="techCircuitCanvas"></canvas>

<div id="scrollProgress"></div>

<div id="site-header"></div>


<main>


<section class="page-hero">

    <div class="page-hero-content reveal">

        <p class="section-label">
            OFFICIAL IAC RECORD
        </p>

        <h1>
            Certificate Verification
        </h1>

        <p>
            Verify certificates issued by IAC.
        </p>

    </div>

</section>


<section class="section">

    <div class="verify-card reveal">

        <div class="verify-icon">
            ✓
        </div>

        <h2>
            Verify Certificate
        </h2>

        <form id="certificateForm">

            <div class="verify-form">

                <input
                    id="certificateId"
                    type="text"
                    placeholder="Enter Certificate ID"
                    autocomplete="off"
                    required
                >

                <button
                    type="submit"
                    class="btn"
                >
                    Verify Certificate
                </button>

            </div>

        </form>


        <div
            id="certificateResult"
            class="verify-result"
            aria-live="polite"
        ></div>

    </div>

</section>


</main>


<div id="site-footer"></div>

<script src="script.js"></script>

</body>
</html>
