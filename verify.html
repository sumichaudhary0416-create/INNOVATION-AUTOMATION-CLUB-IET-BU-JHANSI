<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Certificate Verification | IAC
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body data-page="verify">


<div id="site-header"></div>


<main>


<section class="page-hero">

    <div class="page-hero-content reveal">

        <p class="section-label">
            OFFICIAL VERIFICATION
        </p>

        <h1>
            Certificate Verification
        </h1>

        <p>

            Verify certificates issued
            by Innovation &
            Automation Club.

        </p>

    </div>

</section>



<section class="section">


    <div class="verify-card reveal">


        <div class="verify-icon">
            🛡️
        </div>


        <h2 class="section-title">
            Verify Your Certificate
        </h2>


        <p class="section-intro">

            Enter the unique certificate ID
            printed on your certificate.

        </p>


        <form
            id="certificateForm"
            class="verify-form"
        >

            <input
                id="certificateId"
                class="verify-input"
                type="text"
                placeholder="Example: IAC-2026-001"
                required
            >


            <button
                type="submit"
                class="btn"
            >

                Verify Certificate

            </button>


        </form>


        <div
            id="certificateResult"
            class="verify-result"
        ></div>


    </div>


</section>


</main>


<div id="site-footer"></div>


<script src="script.js"></script>


</body>

</html>
